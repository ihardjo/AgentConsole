[project]
name = "federated-rag"
version = "0.1.0"
description = "Federated data source connector layer for LightRAG. Connects client-owned warehouses and vector DBs into a unified knowledge graph."
requires-python = ">=3.11"
dependencies = [
  "aiomysql>=0.2.0",
  "asyncpg>=0.29.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "lightrag-hku[api,offline-storage]>=1.4.10",
  "motor>=3.6.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/federated_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
