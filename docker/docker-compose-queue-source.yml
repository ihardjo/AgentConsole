version: '3.1'

services:
    postgres:
        image: postgres:18.1-alpine3.21
        container_name: flowise-postgres
        restart: always
        environment:
            - POSTGRES_DB=${DATABASE_NAME:-flowise}
            - POSTGRES_USER=${DATABASE_USER:-admin}
            - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
        ports:
            - '${DATABASE_PORT:-5432}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - flowise-net
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-admin} -d ${DATABASE_NAME:-flowise}']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis:
        image: redis:alpine
        container_name: flowise-redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        networks:
            - flowise-net

    flowise:
        container_name: flowise-main
        image: agentconsole:3.0.8-staging-source
        build:
            context: ..
            dockerfile: Dockerfile
        ports:
            - '${PORT}:${PORT}'
        volumes:
            # Mount local .flowise to container's default location
            - ../.flowise:/root/.flowise
        env_file:
            - .env
        environment:
            # --- Essential Flowise Vars ---
            - PORT=${PORT:-3000}
            - DATABASE_PATH=/root/.flowise
            - SECRETKEY_PATH=/root/.flowise
            - LOG_PATH=/root/.flowise/logs
            - BLOB_STORAGE_PATH=/root/.flowise/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
            - DATABASE_HOST=${DATABASE_HOST:-postgres}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - flowise-net

    flowise-worker:
        container_name: flowise-worker
        image: agentconsole-worker:3.0.8-staging-source
        build:
            context: ..
            dockerfile: docker/worker/Dockerfile
        volumes:
            # Mount same local .flowise to worker
            - ../.flowise:/root/.flowise
        env_file:
            - .env
        environment:
            # --- Essential Flowise Vars ---
            - WORKER_PORT=${WORKER_PORT:-5566} # Port for worker healthcheck
            - DATABASE_PATH=/root/.flowise
            - SECRETKEY_PATH=/root/.flowise
            - LOG_PATH=/root/.flowise/logs
            - BLOB_STORAGE_PATH=/root/.flowise/storage
            # --- Queue Vars (Main Instance) ---
            - MODE=queue
            - QUEUE_NAME=flowise-queue # Ensure this matches worker
            - REDIS_URL=redis://redis:6379 # Use service name 'redis'
            - DATABASE_HOST=${DATABASE_HOST:-postgres}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
            flowise:
                condition: service_started
        networks:
            - flowise-net

volumes:
    redis_data:
        driver: local
    postgres_data:
        driver: local

networks:
    flowise-net:
        driver: bridge